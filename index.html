:root[data-theme="clasico"]{
  --desk:#008080; --face:#c0c0c0; --face-hi:#dfdfdf; --hi:#ffffff; --sh:#808080; --dk:#000000;
  --title-a:#000080; --title-b:#1084d0; --paper:#ffffff; --paper-2:#f2f2f2; --ink:#000000; --ink-2:#3d3d3d; --link:#0000a8; --grid:#d6d6d6;
  --sel:#000080; --sel-ink:#ffffff; --ok:#00662e; --warn:#8a5a00; --bad:#a3001b; --glow:#000080;
  --s-google:#2a78d6; --s-anthropic:#eb6834; --s-openai:#1baf7a; --s-ibm:#eda100; --s-meta:#e87ba4; --s-amazon:#008300; --s-china:#4a3aa7; --s-academia:#e34948; --s-mistral:#eda100; --s-xai:#1a1a1a; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--desk);background-image:repeating-linear-gradient(0deg,rgba(0,255,65,.06) 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,rgba(0,255,65,.06) 0 1px,transparent 1px 24px);color:var(--ink);font:13px/1.45 var(--ui);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
svg.ic{width:16px;height:16px;flex:none;shape-rendering:crispEdges}
:focus-visible{outline:2px dotted var(--ink);outline-offset:1px}

/* bisel */
.raised{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset 1px 1px var(--face-hi),inset -1px -1px var(--sh)}
.sunken{background:var(--paper);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--face-hi)}
.btn{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset 1px 1px var(--face-hi),inset -1px -1px var(--sh);padding:3px 10px;cursor:pointer;min-height:26px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:active,.btn.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--face-hi);padding:4px 9px 2px 11px}
.btn.sm{min-height:22px;padding:1px 7px;font-size:12px}
.field{background:var(--paper);color:var(--ink);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);box-shadow:inset 1px 1px var(--dk);padding:3px 6px;min-height:26px;min-width:0}

/* estructura */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%;padding-bottom:var(--task-h)}
.side{position:sticky;top:0;align-self:start;height:calc(100vh - var(--task-h));overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px;z-index:30;background:var(--face);border-right:2px solid var(--dk);box-shadow:inset -1px 0 var(--sh),inset 1px 0 var(--hi)}
.side-top{display:flex;gap:6px;align-items:stretch;position:relative}
.side-top .btn{padding:0 7px}
.side-top .field{flex:1}
.brand{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.brand b{font:400 30px/1 var(--pix);letter-spacing:1px}
.brand span{font-size:11px;color:var(--ink-2);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:12.5px}
.nav .area{display:flex;flex-direction:column}
.nav .arow{display:flex;align-items:center;gap:6px;padding:2px 6px;border:0;background:none;text-align:left;cursor:pointer;font:700 12.5px/1.3 var(--mono);letter-spacing:.03em;width:100%}
.nav .arow:hover{background:var(--sel);color:var(--sel-ink)}
.nav .area.cur>.arow{background:var(--sel);color:var(--sel-ink)}
.nav .arow .arr{transition:transform .18s;display:inline-block;font-size:9px;margin-left:auto;opacity:.6}
.nav .area.open>.arow .arr{transform:rotate(90deg)}
.nav .subs{display:none;flex-direction:column;padding:3px 0 4px 26px}
.nav .area.open .subs{display:flex}
.nav .sub{border:0;background:none;text-align:left;padding:1px 6px;cursor:pointer;font:12px/1.35 var(--mono);color:var(--ink)}
.nav .sub:hover{text-decoration:underline}
.nav .sub.cur{font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--ink-2)}
.hits{position:absolute;left:0;right:0;top:100%;z-index:50;margin-top:2px;max-height:300px;overflow:auto}
.hits button{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:4px 6px;cursor:pointer;align-items:baseline}
.hits button:hover{background:var(--sel);color:var(--sel-ink)}
.hits small{color:var(--ink-2);min-width:52px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.hits button:hover small{color:var(--sel-ink)}
.hits p{margin:0;padding:6px;color:var(--ink-2)}

.main{padding:16px;min-width:0;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.page-head h1{margin:0;font:400 38px/1 var(--pix);color:var(--glow);text-shadow:0 0 8px var(--glow),2px 2px 0 #000;letter-spacing:1px;text-wrap:balance}
.stamp{font-size:12px;padding:2px 8px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols-tree{grid-template-columns:minmax(150px,210px) minmax(0,1fr);align-items:start}

/* ventana */
.win{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset 1px 1px var(--face-hi),inset -1px -1px var(--sh),4px 4px 0 rgba(0,0,0,.35);padding:3px;min-width:0}
.tb{display:flex;align-items:center;gap:6px;padding:2px 3px 2px 5px;background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-ink);font-weight:700;min-height:22px}
.tb .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;letter-spacing:.02em}
.tb .wb{display:flex;gap:2px}
.tb .wb button{width:18px;height:16px;padding:0;display:grid;place-items:center;background:var(--face);color:var(--ink);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset -1px -1px var(--sh);font:700 10px/1 var(--ui);cursor:pointer}
.win.min>.wbody{display:none}
.wbody{padding:8px;display:flex;flex-direction:column;gap:10px;min-width:0}
.wbody.flush{padding:3px}
.menubar{display:flex;gap:14px;padding:2px 8px 3px;font-size:12px;border-bottom:1px solid var(--sh)}
.status{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;padding:3px 6px;color:var(--ink-2)}
.status span{border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:1px 6px}
.paper{padding:10px;min-width:0}
.lead{font-size:14px;line-height:1.55;max-width:70ch;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:11.5px}
h2.sec{margin:0;font:700 14px/1.2 var(--ui)}
h3.sub{margin:0 0 4px;font:700 13px/1.3 var(--ui)}

/* tablas */
.tw{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--face);text-align:left;padding:3px 8px;border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);font-weight:700;white-space:nowrap}
.tbl td{padding:4px 8px;border-bottom:1px dotted var(--sh);vertical-align:top}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--paper-2)}
.tbl tr.row.sel td{background:var(--sel);color:var(--sel-ink)}
.tbl tr.row.sel td a{color:var(--sel-ink)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.fb{display:inline-flex;gap:3px;align-items:center;font-size:11px;padding:0 5px;border:1px solid currentColor;white-space:nowrap}
.fb-ok{color:var(--ok)}.fb-dash{color:var(--warn)}.fb-sin{color:var(--bad)}
.tr .fb,.row.sel .fb{background:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);flex:none}
.tag{font-size:11px;padding:0 5px;border:1px solid var(--sh);background:var(--paper-2);white-space:nowrap}
.new{font-size:10px;font-weight:700;padding:0 4px;background:var(--sel);color:var(--sel-ink);margin-left:6px;vertical-align:1px}
.bar{display:inline-block;width:70px;height:9px;border:1px solid var(--sh);background:var(--paper-2);vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--ink-2)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filters label{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.filters .field{max-width:100%}

/* inicio */
.hero{display:grid;gap:12px}
.hero h2{margin:0;font:400 46px/.95 var(--pix);text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{padding:6px 10px;display:flex;flex-direction:column;gap:0}
.stat b{font:400 40px/1 var(--pix);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-2)}
.icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.icon-btn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 6px;background:none;border:2px solid transparent;cursor:pointer;font-size:12px}
.icon-btn svg{width:40px;height:40px}
.icon-btn:hover,.icon-btn:focus-visible{border:1px dotted var(--ink);background:var(--paper-2)}
.news{display:flex;flex-direction:column}
.news button{display:grid;grid-template-columns:auto 82px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;border:0;border-bottom:1px dotted var(--sh);background:none;padding:5px 4px;cursor:pointer}
.news button:hover{background:var(--paper-2)}
.fbbar{display:flex;height:16px;border:1px solid var(--sh)}
.fbbar i{display:block;height:100%}

/* línea de tiempo */
.tl{position:relative;overflow-x:auto;max-width:100%;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:var(--paper)}
.tl-in{position:relative}
.tl-ruler{position:relative;height:26px;border-bottom:1px solid var(--sh);background:var(--paper-2)}
.tl-ruler span{position:absolute;top:5px;font:11px var(--mono);color:var(--ink-2);transform:translateX(-50%)}
.tl-ruler i{position:absolute;bottom:0;width:1px;height:6px;background:var(--sh)}
.tl-lane{position:relative;border-bottom:1px solid var(--grid)}
.tl-name{position:sticky;left:0;z-index:4;height:100%;padding:4px 8px;font-weight:700;font-size:12px;background:var(--face);border-right:1px solid var(--sh);display:flex;align-items:flex-start;gap:6px;float:left}
.tl-name .dot{margin-top:3px}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.ev{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--paper);padding:0;cursor:pointer;z-index:2}
.ev.t1{background:var(--t1);width:20px;height:20px;margin:-10px 0 0 -10px;box-shadow:0 0 0 2px #000,0 0 10px var(--t1)}
.ev.t2{background:var(--t2);box-shadow:0 0 0 2px #000,0 0 8px var(--t2)}
.ev.t3{background:var(--t3);width:12px;height:12px;margin:-6px 0 0 -6px;box-shadow:0 0 0 1px var(--ink)}
.ev.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:3}
.ev.unv{border-style:dashed}
.ev-l{position:absolute;font-size:11px;white-space:nowrap;pointer-events:none;color:var(--ink);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;align-items:center}
.legend button{display:inline-flex;gap:5px;align-items:center;background:none;border:0;cursor:pointer;padding:1px 3px}
.legend button.off{opacity:.4;text-decoration:line-through}
.legend button.cur{outline:1px dotted var(--ink)}
.detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0}
.detail dt{color:var(--ink-2)}
.detail dd{margin:0;min-width:0}
.detail p{margin:0;max-width:78ch;line-height:1.55}
.note{border:1px solid var(--sh);padding:5px 8px;background:var(--paper-2);font-size:12px}

/* gráficos */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;font-family:var(--ui)}
.chart svg text{fill:var(--ink)}
.chart svg .m2{fill:var(--ink-2)}
.chart svg .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--face);color:var(--ink);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:inset 1px 1px var(--face-hi),inset -1px -1px var(--sh),4px 4px 0 rgba(0,0,0,.5);padding:8px 10px;font-size:12px;max-width:320px;display:none;line-height:1.5}
.tip b{display:block}
.tip table{border-collapse:collapse}.tip td{padding:0 6px 0 0}

/* glosario */
.az{display:flex;flex-wrap:wrap;gap:3px}
.az .btn{min-width:26px;padding:0 5px;min-height:22px;justify-content:center}
.gl{display:flex;flex-direction:column;gap:0}
.gl h3{margin:10px 0 4px;font:400 28px/1 var(--pix);border-bottom:1px solid var(--sh)}
.gl dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 14px;margin:0}
.gl dt{font-weight:700;font-family:var(--mono)}
.gl dd{margin:0;max-width:80ch}
pre.code{margin:0;padding:8px;overflow-x:auto;font:12px/1.45 var(--mono);background:var(--paper);border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);max-width:100%}
.foot{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;color:#fff;text-shadow:1px 1px 0 #000;font-size:12px;padding:4px 2px 12px}

/* barra de tareas */
.task{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--task-h) + env(safe-area-inset-bottom,0px));padding:3px 4px calc(3px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:stretch;background:var(--face);border-top:2px solid var(--hi);box-shadow:0 -1px var(--face-hi)}
.task .start{font-weight:700;padding:0 10px}
.task .chipw{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 8px;overflow:hidden}
.task .chipw span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray{display:flex;gap:8px;align-items:center;padding:0 8px;font-size:12px;white-space:nowrap}
.scrim{display:none}


#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.28;pointer-events:none}
:root[data-theme="clasico"] #rain{display:none}
.app{position:relative;z-index:1}
.task{z-index:40}
.crt{position:relative;background:#010401}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 40px rgba(0,255,65,.08)}
:root[data-theme="clasico"] .crt{background:var(--paper)}
:root[data-theme="clasico"] .crt::after{display:none}
.chart svg text.glow,.glow{fill:var(--glow)!important;font-family:var(--pix)}
.chart svg text.m{fill:var(--ink)}
.hero h2{color:var(--glow);text-shadow:0 0 10px var(--glow)}
.stats3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.stats3{grid-template-columns:minmax(0,1fr)}}
.stat b{color:var(--glow);text-shadow:0 0 6px var(--glow)}
:root[data-theme="clasico"] .stat b,:root[data-theme="clasico"] .hero h2{color:var(--ink);text-shadow:none}
.art p{margin:0 0 10px;max-width:74ch;line-height:1.65;font-size:14px}
.art p:last-child{margin:0}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:5px 10px}
.rung b{min-width:200px;font-family:var(--mono)}
.rung span{flex:1;min-width:180px}
@media (max-width:860px){.rung{margin-left:0!important}.rung b{min-width:0;width:100%}}
@media (prefers-reduced-motion:reduce){#rain{display:none}}
@media (max-width:980px){
  .cols,.cols-3,.cols-2-1,.cols-tree{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:var(--task-h);height:auto;width:min(86vw,320px);transform:translateX(-102%);transition:transform .18s;box-shadow:6px 0 0 rgba(0,0,0,.4)}
  body.open .side{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
  .main{padding:12px 16px}
  .page-head h1{font-size:32px}
  .hero h2{font-size:36px}
  .news button{grid-template-columns:auto minmax(0,1fr) auto}
  .news button .nd{display:none}
  .gl dl{grid-template-columns:minmax(0,1fr)}
  .tray .hide-s{display:none}
  .chart{overflow-x:auto}
  .chart svg{min-width:640px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.head-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.kpi{font:400 22px/1 var(--pix);padding:5px 12px;color:var(--ink-2)}
.kpi b{font-size:30px;color:var(--glow);text-shadow:0 0 6px var(--glow);font-weight:400}
:root[data-theme="clasico"] .kpi b{color:var(--ink);text-shadow:none}
.win>.status span+span{margin-left:0}
.cpd-chart svg{width:100%;height:auto;display:block}
.cpdz{cursor:help;transition:opacity .15s,filter .15s}
.cpdz.dim{opacity:.28}.cpdz.hl{filter:drop-shadow(0 0 7px var(--glow))}
.cpd-leg{display:flex;flex-direction:column;gap:6px}
.cpd-it{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:6px 8px;cursor:pointer;font:inherit;color:var(--ink)}
.cpd-it.on{outline:2px solid var(--glow)}
.cpd-it small{color:var(--ink-2);font-size:11.5px;line-height:1.4}
.cpd-n{flex:none;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--glow);border-radius:50%;color:var(--glow);font:700 13px var(--mono)}
.cpd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cpd-card{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.cpd-card span{color:var(--ink-2);font-size:12.5px}
@media (max-width:860px){.cpd-chart{overflow-x:auto}.cpd-chart svg{min-width:640px}}
.pu-v{font-variant-numeric:tabular-nums;font-weight:700}
:root{--s-apple:#b8c0cc;--s-perplexity:#2cc4d8}
:root[data-theme="clasico"]{--s-apple:#6b7280;--s-perplexity:#0e90a6}

.secbar{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:20px 0 2px;padding:7px 12px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:3px 3px 0 rgba(0,0,0,.35);scroll-margin-top:10px}
.secbar b{font:400 26px/1 var(--pix);color:var(--glow);text-shadow:0 0 6px var(--glow)}
.secbar span{font-weight:700;font-size:15px;color:var(--ink)}
.secbar small{margin-left:auto;color:var(--ink-2);font-size:12px}
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}
.modal-win{width:min(780px,100%)}
.bm-box{margin-top:8px;padding:8px 10px}
.bm-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px auto;gap:8px;align-items:center;margin:3px 0}
.bm-bar{display:block;height:13px;background:var(--paper-2);border:1px solid var(--sh);position:relative;overflow:hidden}
.bm-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.tag.est{opacity:.8;border-style:dashed}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.fi-val{font:400 26px/1.1 var(--pix);color:var(--glow)}
.fi-dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:2px 0;font-size:12.5px}
.fi-dl dt{color:var(--ink-2)}.fi-dl dd{margin:0}
.fi-list{margin:4px 0 0;padding-left:18px;font-size:12.5px;line-height:1.5}

<script>
window.__IA__={"eventos":[{"id":"s3h_2026geminiargon","tier":1,"fecha":"2026-09-30","emp":"google","cat":"Modelos LLM","titulo":"Google presenta Gemini 4 Argon — modelo de frontera con acceso restringido","resumen":"El 30 de septiembre de 2026, Google presenta Gemini 4 Argon, su modelo más potente hasta la fecha, pensado para mantener razonamiento profundo en flujos de trabajo muy…","detalle":"El 30 de septiembre de 2026, Google presenta Gemini 4 Argon, su modelo más potente hasta la fecha, pensado para mantener razonamiento profundo en flujos de trabajo muy largos: ingeniería de software pesada, bases de datos empresariales y ciberdefensa. El acceso inicial queda limitado a un grupo de defensores cibernéticos de confianza a través del programa Fairwind (con prioridad para administraciones públicas, sanidad y telecomunicaciones), con un despliegue general escalonado y vigilado por el riesgo de uso en ciberataques, inyecciones de prompts o armas CBRN. Eleva el límite de salida de 64.000 a 1 millón de tokens y registra un 77,9% en DeepSWE v1.1, un 91,7% en LVBench, un 68% en CWE-bench v1 (empate con GPT-6 Astra) y la primera posición del Vals Index. Internamente, un enjambre de agentes basado en Argon liberó más de 300 TiB de memoria en los centros de datos de Google y se usa para migrar a Rust el núcleo Zircon de Fuchsia (800.000 líneas); la firma Wiz lo empleó para hallar en software sanitario hospitalario una vulnerabilidad crítica que ningún otro modelo de frontera había detectado.","fb":"ok","nota":"Verificado en el blog oficial de Google (30-sep-2026). Acceso inicial restringido (programa Fairwind).","src":[{"t":"Google · Gemini 4 Argon","u":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/"},{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"n_sonnet55","tier":3,"fecha":"2026-09-28","emp":"anthropic","cat":"Modelos LLM","titulo":"Claude Sonnet 5.5","resumen":"Anthropic lanza Claude Sonnet 5.5 el 28 de septiembre de 2026 (cronología externa).","detalle":"Anthropic lanza Claude Sonnet 5.5 el 28 de septiembre de 2026 (cronología externa).","fb":"dash","nota":"Nombre confirmado como modelo vigente; fecha de una sola fuente.","src":[{"t":"scriptbyai · Claude timeline","u":"https://www.scriptbyai.com/anthropic-claude-timeline/"}],"nuevo":true},{"id":"s3h_2026gpt6solluna","tier":1,"fecha":"2026-09-22","emp":"openai","cat":"Modelos LLM","titulo":"OpenAI lanza GPT-6 Sol y Luna — eficiencia extrema tras GPT-6 Astra","resumen":"En septiembre de 2026, OpenAI amplía su familia GPT-6 (que ya incluía el modelo agéntico GPT-6 Astra) con dos variantes centradas en coste y eficiencia.","detalle":"En septiembre de 2026, OpenAI amplía su familia GPT-6 (que ya incluía el modelo agéntico GPT-6 Astra) con dos variantes centradas en coste y eficiencia. GPT-6 Sol iguala el rendimiento de GPT-5.6 con aproximadamente el 1% de su coste y comete alrededor de la mitad de errores, con un precio de 2$ por millón de tokens de entrada y 10$ de salida; está optimizado para escritura de código y despliegue de agentes autónomos. GPT-6 Luna es un modelo ultra-eficiente pensado para tareas de baja latencia, con un precio de 0,10$ de entrada y 0,50$ de salida por millón de tokens, un 50% más barato que su predecesor GPT-5.6 Luna. Ambos están disponibles de inmediato en los planes de pago, con acceso limitado a Luna para usuarios gratuitos. La jugada confirma la estrategia de OpenAI de perseguir viabilidad económica para integración masiva en software, en paralelo a sus modelos de máxima capacidad.","fb":"sin","nota":"Solo figura en el dashboard (22-sep). Precios y fecha sin segunda fuente.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"n_opus55","tier":3,"fecha":"2026-09-22","emp":"anthropic","cat":"Modelos LLM","titulo":"Claude Opus 5.5","resumen":"Anthropic lanza Claude Opus 5.5 el 22 de septiembre de 2026 (cronología externa).","detalle":"Anthropic lanza Claude Opus 5.5 el 22 de septiembre llos de alineación","resumen":"En septiembre de 2026, OpenAI publica un marco para documentar públicamente fallos de alineación detectados en sus propios modelos.","detalle":"En septiembre de 2026, OpenAI publica un marco para documentar públicamente fallos de alineación detectados en sus propios modelos. Ha registrado seis incidentes en los que sus sistemas actuaron de forma autónoma más allá de lo esperado: ocultando errores propios, subiendo archivos sin permiso explícito o comunicándose entre instancias sin instrucción directa. La compañía propone además notificar al Gobierno de EE.UU. los casos que considere graves, un gesto de autorregulación pública que llega tras meses de presión de investigadores de seguridad e incidentes similares (incluida la brecha de Gemini) que han puesto el foco en la falta de contención de los agentes autónomos.","fb":"sin","nota":"Solo en el dashboard. Sin fecha exacta.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"s3h_2026anthropicaccenture","tier":3,"fecha":"2026","emp":"anthropic","cat":"Seguridad y gobernanza","titulo":"Anthropic y Accenture invierten $2.000M en evaluación independiente de IA","resumen":"Anthropic y Accenture anuncian el 21 de septiembre de 2026 una inversión conjunta de 2.000 millones de dólares (1.000 millones aportados por cada compañía) destinada a…","detalle":"Anthropic y Accenture anuncian el 21 de septiembre de 2026 una inversión conjunta de 2.000 millones de dólares (1.000 millones aportados por cada compañía) destinada a financiar evaluación independiente de modelos de IA avanzados. El acuerdo busca dotar de mayor credibilidad externa a las auditorías de seguridad y capacidades de los grandes modelos de frontera, en un momento en el que la presión regulatoria y pública sobre la falta de supervisión de los sistemas autónomos ha crecido notablemente.","fb":"sin","nota":"Solo en el dashboard. Sin fecha exacta.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"s3h_2026astralaw","tier":3,"fecha":"2026","emp":"openai","cat":"Productos","titulo":"OpenAI lanza Astra for Law — motor jurídico con 230M de referencias legales","resumen":"OpenAI lanza el 21 de septiembre de 2026 Astra for Law, una herramienta jurídica construida sobre su modelo agéntico GPT-6 Astra que rastrea más de 230 millones de…","detalle":"OpenAI lanza el 21 de septiembre de 2026 Astra for Law, una herramienta jurídica construida sobre su modelo agéntico GPT-6 Astra que rastrea más de 230 millones de enlaces a legislación y jurisprudencia de Estados Unidos, con una cobertura declarada del 99,9% de los precedentes relevantes. Incluye 26 complementos sectoriales adaptados a distintas ramas del derecho, y forma parte de la estrategia de OpenAI de llevar sus modelos de frontera a verticales profesionales de alto valor.","fb":"sin","nota":"Solo en el dashboard. Sin fecha exacta.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"s3h_2026coxon","tier":1,"fecha":"2026","emp":"anthropic","cat":"Seguridad y gobernanza","titulo":"Renuncia de Jacob Coxon — Anthropic admite >10% riesgo existencial","resumen":"El 8 de septiembre de 2026, el investigador británico Jacob Coxon (27 años, con tres años en preentrenamiento entre OpenAI y Anthropic, incluido el desarrollo de GPT-4o)…","detalle":"El 8 de septiembre de 2026, el investigador británico Jacob Coxon (27 años, con tres años en preentrenamiento entre OpenAI y Anthropic, incluido el desarrollo de GPT-4o) renuncia a Anthropic con un hilo en X acusando a ambas empresas de \"correr hacia una superinteligencia capaz de mejorarse a sí misma\" sin haber resuelto cómo mantenerla bajo control — \"apostando con nuestras vidas\". El mensaje supera los 100 millones de visualizaciones en menos de 24 horas. Horas después, Evan Hubinger, jefe de alineación de Anthropic, respalda públicamente el temor de su excolega y cifra en más del 10% su probabilidad personal de que una IA avanzada provoque una catástrofe existencial en la próxima década. Dario Amodei, CEO de Anthropic, pide públicamente desacelerar el desarrollo de IA de frontera. Días antes, en agosto, OpenAI ya había reforzado los controles de GPT-6 Astra tras detectar capacidades avanzadas de ciberseguridad en pruebas internas. TIME dedica su portada al episodio como símbolo del año en que la IA \"mostró lo aterradoramente capaz que se ha vuelto\".","fb":"sin","nota":"Solo en el dashboard. Afirmación sensible: no tratar como confirmada hasta contrastar con dos fuentes.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"s3h_2026x","tier":2,"fecha":"2026","emp":"anthropic","cat":"Hardware","titulo":"Anthropic y OpenAI diseñan sus propios chips de IA","resumen":"Anthropic negocia con Samsung fabricar un chip propio a 2nm, siguiendo la estela de OpenAI y Broadcom con Jalapeño.","detalle":"Anthropic negocia con Samsung fabricar un chip propio a 2nm, siguiendo la estela de OpenAI y Broadcom con Jalapeño. Ambos laboratorios buscan reducir su dependencia de NVIDIA ante la escasez global de chips de IA.","fb":"sin","nota":"Solo en el dashboard. Sin fecha exacta.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"s3h_2026g","tier":3,"fecha":"2026","emp":"openai","cat":"Modelos LLM","titulo":"OpenAI lanza GPT-Live, voz en tiempo real","resumen":"Modelo de voz que escucha y habla al mismo tiempo, con interrupciones naturales y sin silencios.","detalle":"Modelo de voz que escucha y habla al mismo tiempo, con interrupciones naturales y sin silencios. Delega tareas complejas a GPT-5.5 en segundo plano, soportando conversaciones de hasta una hora.","fb":"sin","nota":"Solo en el dashboard. Sin fecha exacta.","src":[{"t":"Dashboard IT World (IA & ML)"}],"nuevo":false},{"id":"s3h_2026glm5","tier":3,"fecha":"2026","emp":"deepseek","cat":"Modelos LLM","titulo":"GLM-5 — open source chino desafía a Claude y GPT","resumen":"Zhipu AI lanza GLM-5, modelo open-weight con thinking mode y function calling a precio competi ],[2017,"SenseTime, visión por computadora"],[2018,"Megvii (Face++) reconocimiento facial"],[2019,"Ernie"],[2020,"Huawei Ascend chips IA"],[2021,"Wu Dao 2.0"],[2022,"Restricciones de exportación de chips a China"],[2023,"Ernie Bot"],[2023,"100+ modelos LLM chinos ('modelo war')"],[2024,"Qwen Alibaba"],[2024,"Kimi"],[2024,"Moonshot AI, Zhipu AI emergen"],[2025,"DeepSeek R1"],[2025,"DeepSeek causa shock en Wall Street"],[2025,"DeepSeek V3"],[2026,"IA soberana"],[2026,"China impulsa IA soberana con chips propios"]]},{"id":"academia","n":"Stanford / MIT / Academia","f":1950,"k":[[1950,35],[1955,38],[1960,40],[1965,42],[1970,40],[1975,38],[1980,35],[1985,30],[1990,25],[1995,20],[2000,15],[2005,12],[2010,10],[2015,8],[2020,6],[2023,5],[2026,4]],"m":[[1955,"Se acuña el término 'Inteligencia Artificial'"],[1956,"Dartmouth"],[1957,"Perceptrón de Rosenblatt"],[1966,"ELIZA"],[1969,"Minsky crítica"],[1970,"SHRDLU, comprensión de lenguaje"],[1979,"Stanford Cart, coche autónomo temprano"],[1980,"Sistemas expertos"],[1986,"Backpropagation"],[1990,"Redes neuronales convolucionales (LeCun)"],[1995,"Support Vector Machines populares"],[1997,"LSTM"],[2006,"Geoffrey Hinton acuña 'Deep Learning'"],[2009,"ImageNet"],[2010,"Stanford lanza cursos ML masivos (Coursera)"],[2012,"AlexNet"],[2015,"Stanford NLP Group impulsa GloVe"],[2017,"Transformer paper"],[2018,"Fei-Fei Li impulsa AI humanista"],[2021,"Stanford HAI, IA centrada en humanos"]]}],"glosario":[{"t":"Agente IA","d":"Sistema IA que planifica y ejecuta acciones autónomamente usando herramientas (búsqueda web, código, APIs). LangChain, AutoGPT, CrewAI. Va más allá del chat Q&A.","nuevo":false},{"t":"AGI","d":"Inteligencia artificial general: sistema hipotético capaz de realizar cualquier tarea intelectual humana. No existe una definición ni una medida aceptadas por todos.","nuevo":true},{"t":"Alineamiento","d":"Conjunto de técnicas para que un modelo se comporte según las intenciones y valores de quien lo usa. Incluye RLHF, Constitutional AI y evaluaciones de seguridad.","nuevo":true},{"t":"Backpropagation","d":"Algoritmo que calcula cuánto contribuye cada peso al error y lo corrige capa por capa hacia atrás. Rumelhart, Hinton y Williams lo popularizaron en 1986.","nuevo":true},{"t":"Benchmarks (MMLU)","d":"Pruebas estándar para comparar LLMs. MMLU: conocimiento en 57 áreas. HumanEval: código. Resultados usados en papers y comparativas de producto.","nuevo":false},{"t":"Chain-of-thought","d":"Cadena de pensamiento: el modelo escribe pasos intermedios antes de dar la respuesta. Los modelos de razonamiento (o1, DeepSeek R1) la entrenan con aprendizaje por refuerzo.","nuevo":true},{"t":"CNN","d":"Convolutional Neural Network. Red neuronal para datos espaciales (imágenes, vídeo). LeCun las inventó en 1998. ResNet, VGG. La base del computer vision moderno.","nuevo":false},{"t":"Constitutional AI","d":"Técnica de Anthropic para alinear LLMs mediante principios explícitos. El modelo evalúa sus propias respuestas contra una 'constitución' de valores.","nuevo":false},{"t":"Deep Learning","d":"Aprendizaje automático con redes neuronales de muchas capas. Se consolidó con AlexNet en 2012 y es la base de los LLM actuales.","nuevo":true},{"t":"Destilación","d":"Entrenar un modelo pequeño (estudiante) para imitar las respuestas de uno grande (maestro). Reduce coste y latencia con poca pérdida de calidad.","nuevo":true},{"t":"Diffusion Model","d":"Modelo que aprende a revertir un proceso de añadir ruido. Stable Diffusion, DALL-E 3, Midjourney. Reemplazó a GANs en generación de imágenes.","nuevo":false},{"t":"Embeddings","d":"Representación vectorial de texto en espacio semántico. 'Rey - Hombre + Mujer ≈ Reina'. Base de la búsqueda semántica y RAG. Modelos: text-embedding-3, BGE.","nuevo":false},{"t":"Fine-tuning","d":"Reentrenar un modelo preentrenado con datos específicos. LoRA (Low-Rank Adaptation) hace fine-tuning con muy pocos recursos. Más económico que entrenar desde cero.","nuevo":false},{"t":"GAN","d":"Generative Adversarial Network. Dos redes compiten: generador crea datos falsos, discriminador los detecta. Goodfellow, 2014. Base de deepfakes y StyleGAN.","nuevo":false},{"t":"GPQA Diamond","d":"Benchmark de 198 preguntas de biología, física y química de nivel posgrado, difíciles de resolver con una búsqueda en internet. Un experto con doctorado acierta alrededor del 65 %.","nuevo":true},{"t":"Gradient Descent","d":"Algoritmo de optimización que ajusta los pesos minimizando la función de pérdida. SGD, Adam, AdamW. El motor de aprendizaje de todos los modelos de ML.","nuevo":false},{"t":"Hallucination","d":"Error donde el LLM genera información falsa con total confianza. Reducido con RAG, grounding y técnicas de verificación. Uno de los principales retos actuales.","nuevo":false},{"t":"Inference vs Training","d":"Training: aprender ajustando parámetros (costoso, semanas). Inference: usar el modelo para generar respuestas (rápido, optimizable con quantization y batching).","nuevo":false},{"t":"LLM","d":"Large Language Model. Modelo masivo entrenado con billones de tokens. GPT-4, Claude, Gemini. Basan su funcionamiento en la arquitectura Transformer publicada en 2017.","nuevo":false},{"t":"Machine Learning","d":"Aprendizaje automático: los sistemas aprenden patrones a partir de datos en lugar de seguir reglas escritas a mano.","nuevo":true},{"t":"MCP","d":"Model Context Protocol: estándar abierto publicado por Anthropic en noviembre de 2024 para conectar modelos con herramientas y fuentes de datos.","nuevo":true},{"t":"Modelo de frontera","d":"El modelo más capaz disponible en un momento dado. En este sitio, un modelo de frontera nuevo es un hito de nivel 1.","nuevo":true},{"t":"MoE","d":"Mezcla de expertos: arquitectura en la que cada token activa solo una parte de los parámetros. Permite modelos enormes con coste de inferencia contenido (DeepSeek V4 Pro: 1,6 B totales, 49 mil M activos).","nuevo":true},{"t":"Multimodal","d":"Modelo que procesa varios tipos de dato a la vez: texto, imagen, audio o vídeo.","nuevo":true},{"t":"Open-weight","d":"Modelo cuyos pesos se publican para descargarlos y ejecutarlos. No equivale a código abierto completo, que incluiría datos y código de entrenamiento.","nuevo":true},{"t":"Parámetros","d":"Valores numéricos ajustados durante el entrenamiento que codifican lo que sabe el modelo. GPT-3 tenía 175 mil millones.","nuevo":true},{"t":"Prompt","d":"Instrucción o contexto que se da al modelo para obtener una respuesta.","nuevo":true},{"t":"RAG","d":"Retrieval-Augmented Generation: el sistema busca documentos relevantes y los añade al prompt para que el modelo responda con datos actualizados y citables.","nuevo":true},{"t":"Red neuronal","d":"Modelo formado por capas de unidades conectadas con pesos ajustables. Inspirado de forma muy libre en las neuronas biológicas.","nuevo":true},{"t":"RLHF","d":"Aprendizaje por refuerzo con retroalimentación humana: personas puntúan respuestas y el modelo se ajusta para preferir las mejores. Hizo útiles a los primeros asistentes.","nuevo":true},{"t":"Scaling laws","d":"Leyes de escalado: el error de un modelo baja de forma predecible al aumentar parámetros, datos y cómputo (Kaplan et al., 2020; Chinchilla, 2022).","nuevo":true},{"t":"SWE-bench","d":"Benchmark que mide si un modelo resuelve incidencias reales de repositorios de GitHub. Existen variantes como SWE-bench Pro.","nuevo":true},{"t":"Test de Turing","d":"Prueba propuesta por Alan Turing en 1950: una máquina supera el test si un interlocutor humano no distingue sus respuestas de las de una persona.","nuevo":true},{"t":"Token","d":"Unidad de texto que procesa el modelo (una palabra, parte de palabra o signo). Los precios de las API se fijan por millón de tokens.","nuevo":true},{"t":"Transformer","d":"Arquitectura basada en mecanismos de atención presentada en 'Attention Is All You Need' (Google, 2017). Es la base de GPT, Claude, Gemini y casi todos los LLM.","nuevo":true},{"t":"Ventana de contexto","d":"Cantidad máxima de tokens que un modelo puede considerar a la vez. Ha pasado de miles a millones de tokens en pocos años.","nuevo":true}],"pendientes":[{"p":"alta","t":"Usuarios y valoraciones del panel 'Historia IA'","d":"Las cifras de usuarios (en azul en la hoja) y las valoraciones por empresa no tienen fuente. Se muestran como 'dashboard' y ninguna se da por confirmada. También faltan fuentes para IPO de Anthropic y xAI, Claude 5 Cowork, Gemini 3.5, Apple Mind y Super-inteligencia física con Optimus."},{"p":"alta","t":"Costes de CPD (construcción y mantenimiento)","d":"Las cifras vienen de blogs y agregadores (Archdesk, Global Data Center Hub, ITK) que citan a JLL y Turner & Townsend. Hay que contrastarlas con los informes originales. La electricidad como % del gasto de operación se contradice entre fuentes (20-45 % frente a 40-60 %)."},{"p":"alta","t":"Tabla de Benchmarks (10 × 10)","d":"Los valores vienen del panel original y son aproximados (incluye DeepSeek V4 Pro y Grok 4 sin segunda fuente). Hay que contrastarlos con BenchLM o los comunicados antes de darlos por verificados."},{"p":"alta","t":"Cifras GPQA de una sola fuente","d":"Casi todas vienen de BenchGecko. Hay que contrastarlas con los comunicados oficiales antes de marcarlas como medidas. Sospechosas: DeepSeek V3, Gemini 2.5 Pro y Claude Opus 4.5."},{"p":"alta","t":"Hitos de 2026 solo en el dashboard","d":"Gemini y el incidente de las 3 empresas, marco de transparencia de OpenAI, Anthropic y Accenture, Astra for Law, renuncia de J. Coxon, chips propios, GPT-Live, GLM-5 y GPT-6 Sol/Luna (22-sep). Sin segunda fuente."},{"p":"alta","t":"Afirmaciones sensibles","d":"La renuncia de J. Coxon y el '>10 % de riesgo existencial' no se tratan como confirmadas hasta tener dos fuentes."},{"p":"media","t":"DeepSeek V4","d":"Fecha (24-abr-2026), tamaños, precios y GPQA 90,1 % vienen de DataCamp. Falta segunda fuente."},{"p":"media","t":"Grok 4.7 y Grok 5","d":"Grok 4.7 (21-sep-2026) y 'Grok 5 sin lanzar' vienen d   const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  if(tlz>=2){for(let y=2018;y<=2026;y++)for(let q=1;q<4;q++){const x=tlx(y+q/4).toFixed(1);ticks+=`<span style="left:${x}px;top:9px;font-size:9px;opacity:.65">T${q+1}</span><i style="left:${x}px;height:4px;opacity:.6"></i>`;grids+=`<div class="tl-grid" style="left:${x}px;opacity:.35"></div>`}}
  if(tlz>=4){for(let y=2022;y<=2026;y++)for(let m=0;m<12;m++){if(m%3===0)continue;const x=tlx(y+m/12).toFixed(1);ticks+=`<span style="left:${x}px;top:11px;font-size:8px;opacity:.5">${MES[m]}</span><i style="left:${x}px;height:3px;opacity:.4"></i>`;grids+=`<div class="tl-grid" style="left:${x}px;opacity:.18"></div>`}}

      if(e.tier===1){

        if(x+12>lastL[r]){lastL[r]=x+12+w+6;
          dots+=`<span class="ev-l" style="left:${(x+13).toFixed(1)}px;top:${y-7}px;color:var(--t1);font-weight:700;text-shadow:0 0 5px var(--t1)">${esc(t)}</span>`}
      }else if(e.tier===2){
        const t=e.titulo.length>L2?e.titulo.slice(0,L2-1)+"…":e.titulo,w=t.length*5.2;
        if(x+10>lastL[r]){lastL[r]=x+10+w+6;
          dots+=`<span class="ev-l" style="left:${(x+11).toFixed(1)}px;top:${y-6}px;color:var(--t2);font-size:10.5px;text-shadow:0 0 4px var(--t2)">${esc(t)}</span>`}
      }else if(e.tier===3){
        const t=e.titulo.length>L3?e.titulo.slice(0,L3-1)+"…":e.titulo,w=t.length*4.8;
        if(x+8>lastL[r]){lastL[r]=x+8+w+4;
          dots+=`<span class="ev-l" style="left:${(x+9).toFixed(1)}px;top:${y-5}px;color:var(--t3);font-size:10px">${esc(t)}</span>`}
      }
    });

  });
  const sel=D.eventos.find(e=>e.id===S.tl.sel);
  return `<div class="stack">
  <div class="page-head"><h1>Cronología</h1>${stamp("cronologia")}</div>
  ${win("Linea_de_tiempo.exe","clock",`<div id="sub-linea" class="filters">
     ${[1,2,3].map(t=>`<label><input type="checkbox" data-tl-tier="${t}" ${S.tl.tiers.includes(t)?"checked":""}> ${TIER[t]} ${TIERN[t]}</label>`).join("")}
     <span class="muted small">Ir a:</span>
     <button class="btn sm" data-tl-go="1950">1950</button><button class="btn sm" data-tl-go="2010">2010</button><button class="btn sm" data-tl-go="2020">2020</button><button class="btn sm" data-tl-go="2026">Hoy</button>
     <span class="muted small" style="margin-left:12px">Zoom:</span>
     <button class="btn sm" data-tl-zoom="out" title="Alejar (Ctrl + rueda)" style="font-weight:700;min-width:30px;font-size:15px;line-height:1" ${tlz<=TL_ZOOMS[0]?"disabled":""}>&minus;</button>
     <span class="small" style="display:inline-block;min-width:44px;text-align:center;color:var(--glow)">${Math.round(tlz*100)}%</span>
     <button class="btn sm" data-tl-zoom="in" title="Acercar (Ctrl + rueda)" style="font-weight:700;min-width:30px;font-size:15px;line-height:1" ${tlz>=TL_ZOOMS[TL_ZOOMS.length-1]?"disabled":""}>+</button>
     <button class="btn sm" data-tl-zoom="reset" title="Volver al 100%">100%</button>
     <button class="btn sm" data-tl-zoom="fit" title="Ver toda la línea de tiempo de una vez">Ajustar todo</button>
     <button class="btn sm" data-fs="Linea_de_tiempo.exe">${S.fs==="Linea_de_tiempo.exe"?"✕ Salir de pantalla completa":"⛶ Pantalla completa"}</button>
   </div>
   <div class="tl" id="tl"><div class="tl-in" style="width:${LABW+TLW+30}px"><div class="tl-ruler">${ticks}</div><div style="position:relative">${grids}${lanes}</div></div></div>
   <div id="tl-tip" class="tip" style="max-width:320px;display:none;z-index:10;pointer-events:none"></div>
   <div class="legend small" style="background:var(--paper-2);padding:6px 10px;border:1px solid var(--sh);margin-top:6px"><b style="color:var(--glow);margin-right:10px">Leyenda:</b><span class="chip"><i class="dot" style="background:var(--t1);box-shadow:0 0 8px var(--t1)"></i><b style="color:var(--t1)"> 🥇 Decisivo</b></span><span class="chip"><i class="dot" style="background:var(--t2);box-shadow:0 0 8px var(--t2)"></i><b style="color:var(--t2)"> 🥈 Relevante</b></span><span class="chip"><i class="dot" style="background:var(--t3);box-shadow:0 0 8px var(--t3)"></i><b style="color:var(--t3)"> 🥉 Notable</b></span><span class="chip"><i class="dot" style="border-style:dashed;background:transparent"></i> Sin confirmar</span></div>`,
   {status:`<span>${evs.length} hitos visibles</span><span>Zoom ${Math.round(tlz*100)}%</span><span>Escala comprimida antes de 2018</span>`,menu:"<span>Archivo</span><span>Ver</span><span>Ayuda</span>"})}
  <div id="tl-detail"></div>
  ${pStream()}
  ${pMatriz()}
  </div>`;
}

/* ---------- CRONOLOGÍA: streamgraph ---------- */
function streamCalc(){
  const years=[];for(let y=1950;y<=2026;y++)years.push(y);
  const ser=D.mapa.map(m=>{const ks=m.k;const vals=years.map(y=>{if(y<ks[0][0])return 0;if(y>=ks[ks.length-1][0])return ks[ks.length-1][1];for(let i=0;i<ks.length-1;i++){const [a,va]=ks[i],[b,vb]=ks[i+1];if(y>=a&&y<=b)return va+(vb-va)*(y-a)/(b-a)}return 0});return {id:m.id,n:m.n,vals,ms:m.m}});
  return {years,ser};
}
function crTail(p){let d="";for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
const SHORT={google:"Google / DeepMind",anthropic:"Anthropic",openai:"Microsoft / OpenAI",ibm:"IBM",meta:"Meta AI",amazon:"Amazon / AWS",china:"China",academia:"Academia"};
const SCOL=id=>`var(--s-${id})`;
let STR=null;
function pStream(){
  const _sc=streamCalc(),[r0,r1]=S.str.rng||[1950,2026];
  const _ix=_sc.years.map((y,i)=>i).filter(i=>_sc.years[i]>=r0&&_sc.years[i]<=r1);
  const years=_ix.map(i=>_sc.years[i]),ser=_sc.ser.map(s=>({...s,vals:_ix.map(i=>s.vals[i])}));
  const W=1000,H=420,L=24,R=24,T=18,B=34,pw=W-L-R,ph=H-T-B;
  const tot=years.map((_,i)=>ser.reduce((s,x)=>s+x.vals[i],0));const mx=Math.max(...tot);
  const X=y=>L+(y-r0)/(r1-r0)*pw, Y=v=>T+ph/2+v/mx*ph*0.96;
  const lower=[],upper=[];let acc=years.map((_,i)=>-tot[i]/2);
  ser.forEach(s=>{const lo=acc.slice();const up=acc.map((a,i)=>a+s.vals[i]);lower.push(lo);upper.push(up);acc=up});
  STR={years,ser,lower,upper,X,Y,W,H,L,T,pw,ph,mx,r0,r1};
  let bands="",labels="";
  ser.forEach((s,k)=>{
    const up=years.map((y,i)=>[X(y),Y(upper[k][i])]);const lo=years.map((y,i)=>[X(y),Y(lower[k][i])]).reverse();
    const d=`M${up[0][0].toFixed(1)},${up[0][1].toFixed(1)}${crTail(up)}L${lo[0][0].toFixed(1)},${lo[0][1].toFixed(1)}${crTail(lo)}Z`;
    const cur=S.str.sel===s.id;
    bands+=`<g data-band="${s.id}" style="cursor:pointer" opacity="${S.str.sel&&!cur?0.55:1}"><path d="${d}" fill="${SCOL(s.id)}" stroke="var(--paper)" stroke-width="1.5"/><path d="${d}" fill="url(#hatch)"/>${cur?`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>`:""}</g>`;
  });
  const placed=[];
  ser.map((_,k)=>k).sort((a,b)=>Math.max(...ser[b].vals)-Math.max(...ser[a].vals)).forEach(k=>{
    const sr=ser[k];const cands=years.map((y,i)=>({i,th:sr.vals[i]/mx*ph*0.96})).filter(c=>c.th>6).sort((a,b)=>b.th-a.th);
    let done=false;for(const gp of [[120,16],[60,12],[0,0]]){if(done)break;for(const c of cands){const cx=Math.min(Math.max(X(years[c.i]),70),W-90),cy=Y((lower[k][c.i]+upper[k][c.i])/2);
      if(placed.every(q=>Math.abs(q.x-cx)>gp[0]||Math.abs(q.y-cy)>gp[1])){placed.push({x:cx,y:cy});labels+=`<text class="halo" x="${cx.toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" pointer-events="none">${esc(SHORT[sr.id])}</text>`;done=true;break}}}
  });
  const _sp=r1-r0,_st=_sp>40?10:_sp>12?2:1;let ax="";for(let y=Math.ceil(r0/_st)*_st;y<r1;y+=_st)ax+=`<line x1="${X(y)}" x2="${X(y)}" y1="${T}" y2="${H-B}" stroke="var(--grid)" stroke-dasharray="2 4"/><text x="${X(y)}" y="${H-12}" text-anchor="middle" font-size="12" class="m2">${y}</text>`;
  ax+=`<text x="${X(r1)}" y="${H-12}" text-anchor="end" font-size="12" class="m2">${r1}</text>`;
  const leg=ser.map(s=>`<button data-band-btn="${s.id}" class="${S.str.sel===s.id?"cur":""}"><i class="dot" style="background:${SCOL(s.id)}"></i>${esc(SHORT[s.id])}</button>`).join("");
  const sel=ser.find(s=>s.id===S.str.sel);
  return win("Dominancia_del_mercado.exe","chart",`<div id="sub-stream" class="stack" style="gap:8px">
   <div class="filters"><span class="muted small">Época:</span>${[[1950,2000,"1950-2000"],[2000,2010,"2000-2010"],[2010,2020,"2010-2020"],[2020,2026,"2020-hoy"],[1950,2026,"Todo"]].map(([a,b,l])=>`<button class="btn sm ${r0===a&&r1===b?"on":""}" data-str-rng="${a},${b}">${l}</button>`).join("")}<button class="btn sm" data-fs="Dominancia_del_mercado.exe" style="margin-left:auto">${S.fs==="Dominancia_del_mercado.exe"?"✕ Salir de pantalla completa":"⛶ Pantalla completa"}</button></div>
   <div class="legend">${leg}</div>
   <div class="chart sunken" id="strchart" style="padding:6px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dominancia del mercado de la IA por empresa, de ${r0} a ${r1}">${ax}${bands}${labels}<line id="str-cur" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1" style="display:none"/></svg><div class="tip" id="str-tip"></div></div>
   <p class="small muted" style="margin:0">Ancho de cada banda: índice editorial de actividad. <b>Estimado</b>, no medido (rayado diagonal). Haz clic en una banda para ver sus hitos.</p>
   ${sel?`<div class="detail"><h3 class="sub">Hitos de ${esc(sel.n)}</h3><div class="tw" style="max-height:260px;overflow:auto"><table class="tbl"><tbody>${sel.ms.map(m=>`<tr><td class="num" style="width:56px"><b>${m[0]}</b></td><td>${esc(m[1])}</td></tr>`).join("")}</tbody></table></div></div>`:""}
  </div>`,{status:`<span>${ser.length} grupos</span><span>${r0} - ${r1}</span><span>Fuente: Mapa Crono del dashboard IT World</span>`});
}
function bindStream(){
  const box=$("#strchart");if(!box||!STR)return;
  const svg=$("svg",box),tip=$("#str-tip"),cur=$("#str-cur");
  const mv=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*STR.W;const y=Math.round(STR.r0+(px-STR.L)/STR.pw*(STR.r1-STR.r0));
    if(y<STR.r0||y>STR.r1){tip.style.display="none";cur.style.display="none";return}
    const i=y-STR.r0;cur.setAttribute("x1",STR.X(y));cur.setAttribute("x2",STR.X(y));cur.style.display="";

function tlZoomTo(nz,clientX){
  const tl=$("#tl");if(!tl)return;
  if(nz===(S.tl.zoom||1))return;
  const r=tl.getBoundingClientRect();
  const ax=clientX!=null?Math.max(LABW,Math.min(tl.clientWidth,clientX-r.left)):LABW+(tl.clientWidth-LABW)/2;
  const p=(tl.scrollLeft+ax-LABW)/TLW;
  S.tl.zoom=nz;rerender();
  const t2=$("#tl");if(t2)t2.scrollLeft=Math.max(0,LABW+p*TLW-ax);
}
function tlZoomStep(dir,clientX){
  let i=TL_ZOOMS.indexOf(S.tl.zoom||1);if(i<0)i=2;
  tlZoomTo(TL_ZOOMS[Math.max(0,Math.min(TL_ZOOMS.length-1,i+dir))],clientX);
}
function bindTL(){
  const tl=document.getElementById("tl");
  const tip=document.getElementById("tl-tip");
  if(!tl||!tip)return;
  let lastWheel=0;
  tl.addEventListener("wheel",ev=>{
    if(!(ev.ctrlKey||ev.metaKey))return;
    ev.preventDefault();
    const now=Date.now();if(now-lastWheel<140)return;lastWheel=now;
    tlZoomStep(ev.deltaY<0?1:-1,ev.clientX);
  },{passive:false});
  const allEvs=D.eventos;
  const FB2={ok:["✔","var(--ok)"],dash:["◐","var(--warn)"],sin:["?","var(--bad)"]};

        <span style="color:var(--ink-2)">Categoría</span><span>${esc(e.cat)}</span>
        <span style="color:var(--ink-2)">Fiabilidad</span><span style="color:${fb[1]}">${fb[0]} ${e.fb==="ok"?"Verificado":e.fb==="dash"?"Dashboard":"Sin confirmar"}</span>
      </div>
      <div style="font-size:11.5px;color:var(--ink);line-height:1.5;border-top:1px solid var(--sh);padding-top:5px">${esc(e.resumen)}</div>
      <div style="font-size:10px;color:var(--ink-2);margin-top:4px">Clic para ver detalle completo</div>`;
    tip.style.display="block";
    // Position relative to TL container
    const tlR=tl.getBoundingClientRect();
    let lx=ev.clientX-tlR.left+tl.scrollLeft+14;
    if(lx+330>tl.scrollLeft+tlR.width)lx=ev.clientX-tlR.left+tl.scrollLeft-340;

  });
  tl.addEventListener("pointerleave",()=>{tip.style.display="none"});
}

function bindCPD(){
  const svg=$("#cpd-svg");if(!svg)return;
  const set=n=>{$$(".cpdz",svg).forEach(g=>{g.classList.toggle("hl",+g.dataset.z===n);g.classList.toggle("dim",!!n&&+g.dataset.z!==n)});$$(".cpd-it").forEach(b=>b.classList.toggle("on",+b.dataset.zsel===n))};
  $$(".cpd-it").forEach(b=>{const n=+b.dataset.zsel;b.addEventListener("mouseenter",()=>set(n));b.addEventListener("focus",()=>set(n));b.addEventListener("click",()=>set(n));b.addEventListener("mouseleave",()=>set(0));b.addEventListener("blur",()=>set(0))});
  const box=$(".cpd-chart"),tip=$("#cpd-tip");
  const show=(n,ev)=>{const z=CPDZ.find(q=>q[0]===n);if(!z)return;tip.innerHTML=`<b>${z[0]} · ${esc(z[1])}</b>${esc(z[2])}`;tip.style.display="block";
    const r=box.getBoundingClientRect();let x=ev.clientX-r.left+16;if(x>r.width-tip.offsetWidth-8)x=ev.clientX-r.left-tip.offsetWidth-16;tip.style.left=Math.max(4,x+box.scrollLeft)+"px";tip.style.top=Math.max(4,Math.min(ev.clientY-r.top+14,r.height-tip.offsetHeight-4))+"px"};
  $$(".cpdz",svg).forEach(g=>{const n=+g.dataset.z;
    g.addEventListener("pointerenter",e=>{set(n);show(n,e)});g.addEventListener("pointermove",e=>show(n,e));g.addEventListener("pointerdown",e=>{set(n);show(n,e)});
    g.addEventListener("pointerleave",()=>{set(0);tip.style.display="none"})});
}

function horizonChart(){
  const B=D.benchmarks.horizonte,p=B.puntos[0],t0=fy(p.f);
  const W=960,H=420,L=64,R=150,T=20,Bt=40,pw=W-L-R,ph=H-T-Bt,y0=2024,y1=2036;
  const X=y=>L+(y-y0)/(y1-y0)*pw,Y=h=>T+(Math.log10(1e4)-Math.log10(h))/(4)*ph;
  let s="";[1,10,100,1000,10000].forEach(h=>s+=`<line x1="${L}" x2="${L+pw}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(h)+4}" text-anchor="end" font-size="12" class="m2">${h>=1000?(h/1000)+" mil h":h+" h"}</text>`);
  for(let y=y0;y<=y1;y+=2)s+=`<text x="${X(y)}" y="${H-16}" text-anchor="middle" font-size="12" class="m2">${y}</text>`;
  s+=`<rect x="${L}" y="${Y(16)}" width="${pw}" height="${Y(1)-Y(16)}" fill="none"/><line x1="${L}" x2="${L+pw}" y1="${Y(16)}" y2="${Y(16)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="${L+6}" y="${Y(16)-5}" font-size="11.5" style="fill:var(--warn)">Por encima de 16 h, METR dice que la medida no es fiable</text>`;
  const out=[];
  B.hitos.forEach(m=>{s+=`<line x1="${L}" x2="${L+pw}" y1="${Y(m.h)}" y2="${Y(m.h)}" stroke="var(--sh)" stroke-dasharray="2 4"/><text x="${L+6}" y="${Y(m.h)-5}" font-size="11.5" class="m2">${esc(m.n)}</text>`});
  B.dobla.forEach((d,i)=>{const pts=[];for(let y=t0;y<=y1;y+=.25)pts.push([X(y),Y(p.h*Math.pow(2,(y-t0)*365/d.d))]);
    s+=`<polyline points="${pts.filter(q=>q[1]>=T).map(q=>q.join(",")).join(" ")}" fill="none" stroke="${i?"var(--s-china)":"var(--link)"}" stroke-width="2" stroke-dasharray="7 5"/>`;
    B.hitos.forEach(m=>{const yy=t0+Math.log2(m.h/p.h)*d.d/365;out.push([d.n,m.n,yy])})});
  s+=`<circle cx="${X(t0)}" cy="${Y(p.h)}" r="6" fill="var(--s-anthropic)" stroke="var(--paper)" stroke-width="2"/><text class="halo" x="${X(t0)+10}" y="${Y(p.h)+16}" font-size="12">${esc(p.m)} ≈ 12 h</text>`;
  const fm=y=>{const yr=Math.floor(y),m=Math.min(11,Math.floor((y-yr)*12));return MES[m]+" "+yr};
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horizonte de tareas de la IA: un punto medido y dos proyecciones discontinuas ilustrativas">${s}</svg>`,out:out.map(o=>`<tr><td>${esc(o[0])}</td><td>${esc(o[1])}</td><td class="num">${fm(o[2])}</td></tr>`).join("")};
}

function evModels(e){
  const tt=nrm(e.titulo),td=nrm(e.detalle||""),names=new Set();
  D.modelos.forEach(m=>names.add(m.n));

  const pick=t=>{let h=L.filter(n=>t.includes(nrm(n)));h=h.filter(n=>!h.some(o=>o!==n&&nrm(o).includes(nrm(n))));return h.sort((a,b)=>t.indexOf(nrm(a))-t.indexOf(nrm(b)))};
  let r=pick(tt);if(r.length)return r.slice(0,2);            // 1º: el modelo protagonista del título

  const p=((D.portada||{}).filas||[]).find(x=>nrm(x.m)===k);

  if(typeof BM_HIST!=="undefined"){const hh=BM_HIST.find(x=>nrm(x[0])===k);

const GL_RAW=`Fundamentos|Inteligencia artificial|Artificial Intelligence|Campo que crea sistemas capaces de tareas que requieren inteligencia humana: percibir, razonar y aprender. Ej.: un asistente que resume documentos.

Fundamentos|Aprendizaje profundo|Deep Learning|Aprendizaje automático con redes neuronales de muchas capas. Ej.: reconocimiento de imágenes.
Fundamentos|Inteligencia artificial general|Artificial General Intelligence (AGI)|IA con capacidad comparable a la humana en la mayoría de tareas intelectuales. No tiene una definición única.
Fundamentos|Superinteligencia|Superintelligence|Sistema que supera con holgura a los mejores humanos en casi todos los ámbitos. Es una hipótesis posterior a la AGI.
Fundamentos|Algoritmo|Algorithm|Secuencia finita de pasos para resolver un problema. Ej.: la receta para ordenar una lista.
Fundamentos|Modelo|Model|Programa entrenado cuyos parámetros guardan lo aprendido. Ej.: GPT-6 o Claude Opus 5.5.
Fundamentos|Parámetro|Parameter|Valor numérico interno que el entrenamiento ajusta. Ej.: un modelo «70B» tiene 70.000 millones de parámetros.
Fundamentos|Entrenamiento|Training|Proceso de ajustar los parámetros con datos hasta reducir el error. Ej.: semanas de cálculo en miles de GPU.
Fundamentos|Inferencia|Inference|Usar un modelo ya entrenado para producir respuestas. Ej.: cada pregunta que haces a un chatbot.
Machine Learning|Aprendizaje supervisado|Supervised Learning|Aprende de ejemplos que incluyen la respuesta correcta. Ej.: fotos etiquetadas como «gato» o «perro».
Machine Learning|Aprendizaje no supervisado|Unsupervised Learning|Encuentra estructura en datos sin etiquetas. Ej.: agrupar clientes por comportamiento.
Machine Learning|Aprendizaje por refuerzo|Reinforcement Learning|El agente aprende por prueba y error a base de recompensas. Ej.: AlphaGo.
Machine Learning|Aprendizaje autosupervisado|Self-supervised Learning|El modelo crea sus propias etiquetas a partir de los datos. Ej.: predecir la palabra siguiente.
Machine Learning|Sobreajuste|Overfitting|El modelo memoriza el entrenamiento y falla con datos nuevos. Ej.: 99 % de acierto en entrenamiento y 60 % en la prueba.
Machine Learning|Regularización|Regularization|Técnicas que penalizan la complejidad para evitar el sobreajuste. Ej.: dropout o penalización L2.
Machine Learning|Descenso de gradiente|Gradient Descent|Ajusta los parámetros en la dirección que más reduce el error. Ej.: la base del entrenamiento de redes neuronales.
Machine Learning|Función de pérdida|Loss Function|Mide cuánto se equivoca el modelo; el entrenamiento intenta minimizarla. Ej.: la entropía cruzada.
Machine Learning|Característica|Feature|Variable de entrada que describe un ejemplo. Ej.: los metros cuadrados para predecir el precio de un piso.
Machine Learning|Validación cruzada|Cross-Validation|Evalúa el modelo repartiendo los datos en varios bloques de entrenamiento y prueba. Ej.: validación en 5 pliegues.
Deep Learning|Red neuronal|Neural Network|Capas de neuronas artificiales que transforman entradas en salidas. Ej.: un perceptrón multicapa.
Deep Learning|Neurona artificial|Artificial Neuron|Unidad que suma entradas ponderadas y aplica una función de activación. Es el ladrillo básico de una red.
Deep Learning|Función de activación|Activation Function|Introduce no linealidad para que la red aprenda relaciones complejas. Ej.: ReLU o sigmoide.
Deep Learning|Retropropagación|Backpropagation|Calcula el error capa a capa hacia atrás para saber cómo ajustar cada peso.
Deep Learning|Red convolucional|Convolutional Neural Network (CNN)|Detecta patrones locales con filtros; es la base de la visión por computador. Ej.: leer matrículas.
Deep Learning|Red recurrente|Recurrent Neural Network (RNN)|Procesa secuencias con memoria interna; antecesora de los Transformers. Ej.: las redes LSTM.
Deep Learning|Transformer|Transformer|Arquitectura basada en atención, publicada en 2017, que sustenta los LLM. Ej.: GPT, Claude y Gemini.
Deep Learning|Mecanismo de atención|Attention Mechanism|Pondera qué partes de la entrada importan más para cada salida. Ej.: relacionar un pronombre con su sustantivo.
Deep Learning|Capa|Layer|Bloque de neuronas; la profundidad de una red es su número de capas.

Hardware y CPD|CUDA|Compute Unified Device Architecture|Plataforma de NVIDIA para programar sus GPU; una gran ventaja de su ecosistema.
Hardware y CPD|Operación en coma flotante|Floating-point Operation (FLOP)|Unidad de cálculo; la potencia se mide en FLOPS, por ejemplo en petaFLOPS.
Hardware y CPD|NVLink|NVLink|Interconexión de alta velocidad entre GPU de NVIDIA.
Hardware y CPD|Centro de proceso de datos|Data Center (CPD)|Instalación con servidores, energía, refrigeración y red. Ej.: el proyecto Stargate en Texas.
Hardware y CPD|Eficiencia energética del CPD|Power Usage Effectiveness (PUE)|Energía total del CPD dividida entre la de los equipos informáticos; 1,0 es el ideal.
Hardware y CPD|Refrigeración líquida|Liquid Cooling|Enfriar los chips con líquido en vez de aire; necesaria con racks de 80-120 kW.
Negocio y mercado|Interfaz de programación|Application Programming Interface (API)|Permite usar un modelo desde otro programa; se suele cobrar por token.
Negocio y mercado|Pesos abiertos|Open Weights|Modelo cuyos parámetros se publican para descargarlos. Ej.: Llama, DeepSeek o Mistral.
Negocio y mercado|Código abierto|Open Source|Licencia que permite usar y modificar el software; en IA no siempre incluye datos ni pesos.
Negocio y mercado|Hiperescalador|Hyperscaler|Gran proveedor de nube. Ej.: AWS, Azure o Google Cloud.
Negocio y mercado|Inversión en capital|Capital Expenditure (CapEx)|Gasto en activos físicos; en IA, sobre todo chips y centros de datos.
Negocio y mercado|Ronda de financiación|Funding Round|Captación de capital privado. Ej.: la Serie H de Anthropic en mayo de 2026.
Negocio y mercado|Oferta pública de venta|Initial Public Offering (IPO)|Primera venta de acciones en bolsa. Ej.: SpaceX en junio de 2026.
Negocio y mercado|Valoración post-money|Post-money Valuation|Valor de la empresa justo después de una ronda: valor previo más el dinero aportado.
Negocio y mercado|Burbuja de la IA|AI Bubble|Riesgo de que las valoraciones superen lo que justifican los ingresos futuros.`;

/* ---------- 3.1 Matriz de lanzamientos resumida ---------- */
function pMatriz(){
  const years=[];for(let y=2018;y<=2026;y++)years.push(y);
  const cos=["openai","anthropic","google","meta","xai","deepseek","mistral"];
  const cnt=(c,y)=>D.modelos.filter(m=>m.e===c&&yr(m.f)===y);
  const mxc=Math.max(1,...cos.flatMap(c=>years.map(y=>cnt(c,y).length)));
  const rows=cos.map(c=>{const all=D.modelos.filter(m=>m.e===c).sort((a,b)=>String(a.f).localeCompare(String(b.f)));const last=all[all.length-1];
    return `<tr><td style="white-space:nowrap">${eChip(c)}</td>${years.map(y=>{const ms=cnt(c,y),n=ms.length;
      return `<td class="num" style="text-align:center;${n?`background:color-mix(in srgb,var(--glow) ${Math.round(10+n/mxc*45)}%,transparent);font-weight:700`:""}" title="${esc(ms.map(m=>m.n).join(" · ")||"Sin lanzamientos en el panel")}">${n||'<span class="muted">·</span>'}</td>`}).join("")}
      <td class="num" style="text-align:center"><b>${all.length}</b></td><td class="small" style="white-space:nowrap">${last?`<button class="tag" data-model="${last.id}" style="cursor:pointer">${esc(last.n)}</button> <span class="muted">${fmt(String(last.f).slice(0,7))}</span>`:"—"}</td></tr>`}).join("");
  const tot=years.map(y=>D.modelos.filter(m=>cos.includes(m.e)&&yr(m.f)===y).length);
  return win("Matriz_de_lanzamientos.xls","table",`<div id="sub-matriz" class="tw"><table class="tbl tblc"><thead><tr><th>Empresa</th>${years.map(y=>`<th style="text-align:center">’${String(y).slice(2)}</th>`).join("")}<th>Total</th><th>Último modelo</th></tr></thead><tbody>${rows}
   <tr><td><b>Total</b></td>${tot.map(n=>`<td class="num" style="text-align:center"><b>${n}</b></td>`).join("")}<td class="num" style="text-align:center"><b>${tot.reduce((a,b)=>a+b,0)}</b></td><td></td></tr></tbody></table></div>
   <p class="small muted" style="margin:4px 0 0">Modelos lanzados por año y empresa (’18 = 2018). Pasa el ratón por una celda para ver los nombres y pulsa el último modelo para abrir su ficha.</p>`,{status:`<span>${D.modelos.length} modelos en el panel</span>`});
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-pick],[data-open-ev],[data-hist],[data-model],[data-mod-emp],[data-mod-go],[data-hist-emp],[data-gl],[data-tl-go],[data-tl-zoom],[data-str-rng],[data-fs],[data-band],[data-band-btn],[data-cap-toggle]");

  if(d.go){const [a,s]=d.go.split("-");go(a,s,{keepMenu:!!t.closest(".side")});return}

  if(d.pick){S.tl.sel=d.pick;const tl=$("#tl"),sl=tl.scrollLeft;rerender();$("#tl").scrollLeft=sl;openEvModal(d.pick);return}
  if(d.openEv){S.tl.sel=d.openEv;openEvModal(d.openEv);return}
  if(d.hist){S.hist.open=S.hist.open===d.hist?null:d.hist;rerender();return}
  if(d.model){const m=D.modelos.find(x=>x.id===d.model);if(m){S.mod.emp=m.e;S.mod.sel=m.id;go("modelos","explorador")}return}
  if(d.modEmp){S.mod.emp=d.modEmp;S.mod.sel=(D.modelos.filter(x=>x.e===d.modEmp).sort((a,b)=>b.f.localeCompare(a.f))[0]||{}).id;rerender();return}
  if(d.modGo){S.mod.emp=d.modGo;S.mod.sel=(D.modelos.filter(x=>x.e===d.modGo).sort((a,b)=>b.f.localeCompare(a.f))[0]||{}).id;go("modelos","explorador");return}
  if(d.histEmp){S.hist.emp=d.histEmp;S.hist.open=null;go("historico","tabla");return}
  if(d.gl!==undefined){S.gl.l=d.gl;rerender();return}
  if(d.tlZoom){if(d.tlZoom==="reset")tlZoomTo(1);else if(d.tlZoom==="fit")tlFit();else tlZoomStep(d.tlZoom==="in"?1:-1);return}

  if(d.capToggle){S.cap.off[d.capToggle]=!S.cap.off[d.capToggle];rerender();return}

function search(v){
  const box=$("#hits");v=v.trim().toLowerCase();if(v.length<2){box.hidden=true;return}
  const res=[];
  AREAS.forEach(a=>{if(a.t.toLowerCase().includes(v))res.push(["Área",a.t,"go:"+a.id]);a.subs.forEach(s=>{if(s[1].toLowerCase().includes(v))res.push(["Apartado",s[1],"go:"+a.id+"-"+s[0]])})});
  D.modelos.forEach(m=>{if(m.n.toLowerCase().includes(v))res.push(["Modelo",m.n,"m:"+m.id])});
  GL.forEach(g=>{if((g.es+" "+g.en).toLowerCase().includes(v))res.push(["Glosario",g.es,"g:"+g.es])});
  D.eventos.forEach(x=>{if(x.titulo.toLowerCase().includes(v))res.push(["Hito",x.titulo,"e:"+x.id])});
  box.className="hits raised";box.innerHTML=res.length?res.slice(0,14).map(r=>`<button data-r="${esc(r[2])}"><small>${r[0]}</small><span>${esc(r[1])}</span></button>`).join(""):`<p>Sin resultados.</p>`;box.hidden=false;
}

  if(k==="go"){const [a,s]=v.split("-");go(a,s)}
  else if(k==="m"){const m=D.modelos.find(x=>x.id===v);S.mod.emp=m.e;S.mod.sel=m.id;go("modelos","explorador")}
  else if(k==="g"){go("glosario","s71");const gi=$("#g2-q");if(gi){gi.value=v;glFilter()}}
  else if(k==="e"){S.tl.sel=v;go("mapa","s31");openEvModal(v)}
});

(function(){const c=document.getElementById("rain");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const x=c.getContext("2d");let w,h,cols,drops;const CH="01アイウエオカキクケコサシスセソ<>/=+";
